name: Build and publish GHCR timber image

on:
  workflow_dispatch:
    inputs:
      target:
        description: relisten.net (production) or soundcheck.relisten.net (staging)
        type: choice
        options:
          - production
          - staging
        default: production

permissions:
  contents: read
  id-token: write
  packages: write

env:
  IMAGE_NAME: relistennet/relisten-web-timber
  REGISTRY: ghcr.io
  KEEP_GHCR_SHA_VERSIONS: '5'
  # Staging is its own Deployment with its own server action key, so a staging
  # build never moves :latest or breaks actions in open relisten.net tabs.
  DEPLOYMENT: ${{ inputs.target == 'staging' && 'relisten-web-staging' || 'relisten-web-timber' }}
  ACTIONS_SECRET: ${{ inputs.target == 'staging' && 'relisten-web-staging-actions' || 'relisten-web-timber-actions' }}
  CHANNEL_TAG: ${{ inputs.target == 'staging' && 'staging' || 'latest' }}

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    environment: relisten3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "package=${IMAGE_NAME#relistennet/}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          ping: 100.99.27.11
          use-cache: 'true'
          tags: tag:ci
          version: '1.104.1'

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.36.2

      - name: Configure relisten3 kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config use-context relisten3-k3s

      # Server action IDs are salted with this key, and the deployment reads
      # the same Secret at runtime (relisten-flux). Without it, timber picks
      # random IDs and every deploy breaks actions in tabs that were already
      # open, so a missing or empty key fails the build. It's written to a
      # temp file for the BuildKit secret, never to an output or the log.
      - name: Read the server action key
        run: |
          set -euo pipefail
          key="$(kubectl -n default get secret "$ACTIONS_SECRET" \
            -o jsonpath='{.data.TIMBER_ACTIONS_ENCRYPTION_KEY}' | base64 -d)"
          if [ -z "$key" ]; then
            echo "::error::default/$ACTIONS_SECRET has no TIMBER_ACTIONS_ENCRYPTION_KEY"
            exit 1
          fi
          echo "::add-mask::$key"
          umask 077
          printf '%s' "$key" > "$RUNNER_TEMP/timber_actions_key"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          secret-files: |
            timber_actions_key=${{ runner.temp }}/timber_actions_key
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.CHANNEL_TAG }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.version=sha-${{ steps.meta.outputs.short_sha }}
          push: true

      - name: Verify GHCR package visibility
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: relistennet
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          set -euo pipefail
          visibility="$(gh api "/orgs/$ORG/packages/container/$PACKAGE" --jq '.visibility')"
          if [ "$visibility" != "private" ]; then
            echo "::error::GHCR package $ORG/$PACKAGE visibility is '$visibility', expected 'private'"
            exit 1
          fi

      - name: Prune old GHCR image versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN || github.token }}
          ORG: relistennet
          PACKAGE: ${{ steps.meta.outputs.package }}
          KEEP: ${{ env.KEEP_GHCR_SHA_VERSIONS }}
        run: |
          set -euo pipefail
          ids="$(
            gh api --paginate "/orgs/$ORG/packages/container/$PACKAGE/versions?per_page=100" \
              --jq '.[] | {id, created_at, tags: (.metadata.container.tags // [])}' |
            jq -s --argjson keep "$KEEP" '
              sort_by(.created_at) | reverse
              | map(select(any(.tags[]?; startswith("sha-"))))
              | .[$keep:]
              | map(select((.tags | index("latest") or index("staging")) | not))
              | .[].id
            '
          )"
          if [ -z "$ids" ]; then
            echo "No old GHCR versions to prune for $ORG/$PACKAGE"
            exit 0
          fi
          while read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting old GHCR package version $id for $ORG/$PACKAGE"
            gh api -X DELETE "/orgs/$ORG/packages/container/$PACKAGE/versions/$id"
          done <<< "$ids"

      - name: Restart relisten3 deployment
        run: |
          set -euo pipefail
          kubectl -n default rollout restart "deployment/$DEPLOYMENT"
          kubectl -n default rollout status "deployment/$DEPLOYMENT" --timeout=10m
